<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading Screen</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body, html {
      height: 100%;
      margin: 0;
      background-color: #FAE2E8; /* Pink background */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchIAAA==') repeat;
      filter: blur(5px);
      opacity: 0;
      animation: fadeIn 2s ease-in forwards;
    }
    .loader {
      --main-size: 4em;
      --text-color: #D81B60; /* Vibrant pink */
      --shine-color: #D81B6040; /* Translucent pink */
      --shadow-color: #FF69B4; /* Lighter pink */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible; /* Ensure no clipping */
      user-select: none;
      position: relative;
      font-size: var(--main-size);
      font-weight: 900;
      font-family: sans-serif;
      text-transform: uppercase;
      color: var(--text-color);
      width: auto;
      height: auto;
      filter: drop-shadow(0 0 0.1em var(--shine-color));
      z-index: 1;
    }
    .loader .text {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      font-size: 1em; /* Consistent size for all letters */
      margin: 0 0.05em; /* Small spacing between letters */
      opacity: 1; /* Full visibility */
    }
    .loader .text span {
      animation:
        scrolling 2s cubic-bezier(0.1, 0.6, 0.9, 0.4) infinite,
        shadow 2s cubic-bezier(0.1, 0.6, 0.9, 0.4) infinite;
      background: linear-gradient(
        to right,
        var(--text-color) 20%,
        var(--shadow-color) 40%
      );
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }
    .loader .line {
      position: absolute;
      bottom: -0.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: 0.05em;
      width: 50%;
      border-radius: 0.05em;
    }
    .loader .line::before {
      content: "";
      position: absolute;
      height: 100%;
      width: 100%;
      background-color: var(--text-color);
      opacity: 0.3;
    }
    .loader .line::after {
      content: "";
      position: absolute;
      height: 100%;
      width: 100%;
      background-color: var(--text-color);
      border-radius: 0.05em;
      transform: translateX(-90%);
      animation: wobble 2s cubic-bezier(0.5, 0.8, 0.5, 0.2) infinite;
    }
    @keyframes wobble {
      0% {
        transform: translateX(-90%);
      }
      50% {
        transform: translateX(90%);
      }
      100% {
        transform: translateX(-90%);
      }
    }
    @keyframes scrolling {
      0% {
        transform: translateX(-20%);
      }
      100% {
        transform: translateX(20%);
      }
    }
    @keyframes shadow {
      0% {
        background-position: -98% 0;
      }
      100% {
        background-position: 102% 0;
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (max-width: 576px) {
      .loader {
        --main-size: 2em; /* Adjusted for smaller screens */
      }
      .loader .text {
        margin: 0 0.03em; /* Tighter spacing on mobile */
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen"></div>
  <div class="loader">
    <div class="text"><span>E</span></div>
    <div class="text"><span>N</span></div>
    <div class="text"><span>D</span></div>
    <div class="text"><span>E</span></div>
    <div class="text"><span>A</span></div>
    <div class="text"><span>R</span></div>
    <div class="text"><span>M</span></div>
    <div class="text"><span>E</span></div>
    <div class="text"><span>N</span></div>
    <div class="text"><span>T</span></div>
    <div class="line"></div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.location.href = "man2.html";
      }, 4000);
    });
  </script>
</body>
</html>
