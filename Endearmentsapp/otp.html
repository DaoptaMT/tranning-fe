<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTP Verification</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --default-color: #F6D8DC;
      --heading-color: #FAE2E8;
      --accent-color: #FAE2E8;
      --dark-pink: #ef447a;
      --light-pink: #FFF0F5;
      --container-width: 320px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--light-pink) 0%, var(--accent-color) 50%, #ffd1dc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, rgba(239, 68, 122, 0.15), transparent);
      clip-path: path('M0,150 C300,250 600,50 900,150 C1200,250 1500,50 1800,150 L1920,0 H0 Z');
      animation: wave 7s infinite ease-in-out;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      background: linear-gradient(to top, rgba(250, 226, 232, 0.2), transparent);
      clip-path: path('M0,180 C350,100 700,200 1050,150 C1400,100 1750,200 1920,150 L1920,0 H0 Z');
      animation: wave 9s infinite ease-in-out reverse;
      z-index: 0;
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .otp-container {
      text-align: center;
      width: var(--container-width);
      position: relative;
      z-index: 1;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: center;
      margin-bottom: 0.5rem;
      z-index: 1;
    }

    .otp-container h2 {
      margin-bottom: 0.75rem;
      font-weight: 700;
      font-size: 22px;
      color: #000;
      line-height: 1.1;
    }
    .icon {
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease-in-out;
    }

    .icon:hover { transform: scale(1.05); }

    .icon i {
      font-size: 180px;
      color: #ef447a;
    }

    .otp-message {
      font-size: 16px;
      color: #000;
      margin-bottom: 1rem;
    }

    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .otp-input {
      width: 50px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      border: 1px solid #F7C1C8;
      border-radius: 10px;
      background: rgba(255,255,255,0.9);
      outline: none;
    }

    .otp-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(250, 226, 232, 0.5);
    }

    button[type="submit"] {
      margin-top: 0.75rem;
      border-radius: 25px;
      color: #fff;
      background: linear-gradient(135deg, var(--dark-pink), #ff8aa0);
      padding: 12px 0;
      width: 100%;
      border: none;
      transition: transform .2s;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }

    button[type="submit"]:active { transform: translateY(1px); }

    .error {
      color: #c5304a;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    @media (max-width: 420px) {
      :root { --container-width: calc(100% - 32px); }
      .otp-container h2 { font-size: 20px; }
      .icon { width: 140px; height: 140px; }
      .icon i { font-size: 140px; }
      .otp-input { width: 40px; height: 40px; font-size: 18px; }
      button[type="submit"] { padding: 12px; font-size: 15px; }
    }

    @media (min-width: 768px) {
      .otp-container { width: 360px; padding: 26px; }
      .icon { width: 200px; height: 200px; }
      .icon i { font-size: 200px; }
      .otp-container h2 { font-size: 24px; }
      button[type="submit"] { font-size: 16px; }
    }

    @media (max-height: 520px) {
      body { align-items: flex-start; padding-top: 18px; }
    }
  </style>
</head>
<body>
  <div class="otp-container">
    <div class="header">
      <div class="icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
    </div>
    <h2>Xác thực OTP</h2>
    <div class="otp-message">Xin chào Nhi, vui lòng nhập mã OTP đã gửi từ email</div>
    <div class="otp-inputs">
      <input type="text" class="otp-input" maxlength="1" autofocus>
      <input type="text" class="otp-input" maxlength="1">
      <input type="text" class="otp-input" maxlength="1">
      <input type="text" class="otp-input" maxlength="1">
    </div>
    <div class="error" id="error-message">Mã OTP không hợp lệ</div>
    <button type="submit" onclick="verifyOTP()">Xác nhận</button>
    <p class="otp-message"> Bạn chưa nhận được OTP?Gửi lại OTP</p>
  </div>
  <script>
    const inputs = document.querySelectorAll('.otp-input');

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value;
        if (value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });

      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
      });
    });

    function verifyOTP() {
      const otp = Array.from(inputs).map(input => input.value).join('');
      const errorMessage = document.getElementById('error-message');
      
      if (otp.length === 4 && /^\d{4}$/.test(otp)) {
        errorMessage.style.display = 'none';
        alert('OTP verified successfully!');
      } else {
        errorMessage.style.display = 'block';
      }
    }
  </script>
</body>
</html>
